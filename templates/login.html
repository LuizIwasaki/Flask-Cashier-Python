{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2 class="form-title"><i class="ph ph-sign-in"></i> Entrar na sua Conta</h2>
    <p class="form-subtitle">Acesse para cadastrar novos produtos e gerenciar o mercado</p>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="email"><i class="ph ph-envelope"></i> E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
            <label for="senha"><i class="ph ph-lock"></i> Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="margin-top: 1rem;">
            Entrar
        </button>
    </form>
    <div class="form-footer">
        Não tem uma conta? <a href="{{ url_for('cadastro') }}">Cadastre-se aqui</a>
    </div>
</div>
{% endblock %}
