{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2 class="form-title"><i class="ph ph-package-plus"></i> Cadastrar Novo Produto</h2>
    <p class="form-subtitle">Adicione um novo produto à lista de vendas do mercado</p>
    <form action="{{ url_for('novo_produto') }}" method="POST">
        <div class="form-group">
            <label for="nome"><i class="ph ph-tag"></i> Nome do Produto *</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Smart TV 55 polegadas" required>
        </div>
        <div class="form-group">
            <label for="preco"><i class="ph ph-currency-dollar"></i> Preço (R$) *</label>
            <input type="text" inputmode="decimal" id="preco" name="preco" placeholder="0,00" oninput="formatarMoeda(this)" required>
        </div>
        <div class="form-group">
            <label for="descricao"><i class="ph ph-note"></i> Descrição</label>
            <textarea id="descricao" name="descricao" rows="4" placeholder="Breve descrição do produto..."></textarea>
        </div>
        <div class="form-group">
            <label for="imagem"><i class="ph ph-image"></i> URL da Imagem</label>
            <input type="url" id="imagem" name="imagem" placeholder="https://exemplo.com/imagem.jpg (Opcional)">
        </div>
        <button type="submit" class="btn btn-primary w-100" style="margin-top: 1rem;">
            Cadastrar Produto
        </button>
    </form>
    <div class="form-footer">
        <a href="{{ url_for('index') }}"><i class="ph ph-arrow-left"></i> Voltar para a Loja</a>
    </div>
</div>

<script>
    function formatarMoeda(input) {
        // Remove tudo que não for número
        let valor = input.value.replace(/\D/g, "");
        if (valor === "") {
            input.value = "";
            return;
        }
        // Converte para float com duas casas decimais
        let valorFloat = parseFloat(valor) / 100;
        // Formata como moeda brasileira (apenas números e pontuações)
        input.value = valorFloat.toLocaleString("pt-BR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }
</script>
{% endblock %}
