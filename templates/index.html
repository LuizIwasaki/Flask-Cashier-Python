{% extends 'base.html' %}

{% block content %}
<h1 class="page-title">Nossos Produtos</h1>

<div class="products-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image }}" alt="{{ product.name }}" class="product-image">
        <div class="product-info">
            <h3 class="product-title">{{ product.name }}</h3>
            <p class="product-desc">{{ product.description }}</p>
            <div class="product-footer">
                <span class="product-price">R$ {{ "%.2f"|format(product.price) }}</span>
                <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
                    <button type="submit" class="btn btn-primary">
                        <i class="ph ph-plus-circle"></i> Adicionar
                    </button>
                </form>
            </div>
        </div>
    </div>
    {% else %}
    <div class="empty-state">
        <i class="ph ph-package" style="font-size: 4rem; color: var(--text-muted);"></i>
        <h3>Nenhum produto disponível</h3>
        <p>Volte mais tarde para conferir as novidades.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
